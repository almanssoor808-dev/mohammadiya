<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام المحمدية (سحابي آمن)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');

  :root {
    --ink: #0f1923;
    --ink-soft: #3d5166;
    --gold: #c8922a;
    --gold-light: #f5e8d0;
    --gold-pale: #fdf8f0;
    --teal: #0d6b6b;
    --teal-light: #e0f2f1;
    --red: #c0392b;
    --red-light: #fdecea;
    --green: #1a7a4a;
    --green-light: #e8f5ee;
    --surface: #ffffff;
    --bg: #f4f6f9;
    --border: #dde3ec;
    --shadow: 0 2px 12px rgba(15,25,35,0.08);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  .topbar {
    background: var(--ink);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .topbar-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .topbar-title span { color: var(--gold); }
  .topbar-date { font-size: 12px; color: #8fa0b4; }

  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 57px;
    z-index: 99;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 1;
    min-width: 90px;
    padding: 13px 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .tab-btn .tab-icon { font-size: 16px; display: block; margin-bottom: 2px; }

  .page { display: none; padding: 16px; padding-bottom: 80px; }
  .page.active { display: block; }

  .stats-strip {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .stat-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 900; color: var(--ink); }
  .stat-value.gold { color: var(--gold); }
  .stat-value.red { color: var(--red); }
  .stat-value.green { color: var(--green); }
  .stat-unit { font-size: 11px; font-weight: 400; color: var(--ink-soft); margin-right: 2px; }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 18px;
    background: var(--gold);
    border-radius: 2px;
  }

  .form-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 12px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #f8fafc;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  input:focus, select:focus { border-color: var(--gold); background: white; }
  .btn-primary {
    background: var(--ink);
    color: white;
    border: none;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
    margin-top: 4px;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary {
    background: var(--gold-light);
    color: #7a5010;
    border: none;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }

  .client-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .client-card.delayed { border-right: 4px solid var(--red); }
  .client-card.completed { border-right: 4px solid var(--green); }
  .client-card.on-track { border-right: 4px solid var(--gold); }

  .client-head {
    padding: 14px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .client-name { font-size: 16px; font-weight: 700; color: var(--ink); }
  .client-phone { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .client-phone a { color: inherit; text-decoration: none; }

  .status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge-completed { background: var(--green-light); color: var(--green); }
  .badge-delayed { background: var(--red-light); color: var(--red); }
  .badge-on-track { background: var(--gold-light); color: #8a5c0e; }

  .client-body { padding: 0 16px 14px; }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 12.5px;
  }
  .info-item .lbl { color: var(--ink-soft); font-size: 11px; }
  .info-item .val { font-weight: 700; color: var(--ink); font-size: 13px; }
  .info-item .val.danger { color: var(--red); }
  .info-item .val.success { color: var(--green); }

  .progress-wrap { margin: 12px 0 10px; }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .progress-bar {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius: 4px;
  }

  .client-actions {
    display: flex;
    gap: 6px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .action-btn {
    flex: 1;
    min-width: 60px;
    padding: 9px 6px;
    border-radius: 8px;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .btn-pay { background: var(--teal-light); color: var(--teal); }
  .btn-discount { background: #fdf3e3; color: #b7791f; }
  .btn-details { background: var(--gold-light); color: #7a5010; }
  .btn-edit { background: #e6edf7; color: #2952a3; }
  .btn-del { background: var(--red-light); color: var(--red); flex: 0 0 42px !important; }

  .search-box { position: relative; margin-bottom: 14px; }
  .search-box input { background: white; padding-right: 40px; }
  .search-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }

  .filter-chips {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: white;
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .chip.active { background: var(--ink); color: white; border-color: var(--ink); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,25,35,0.6);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: white;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 16px; text-align: center; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    z-index: 999;
    transition: transform 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.green { background: var(--green); }
  .toast.red { background: var(--red); }
  .toast.yellow { background: #f1c40f; color: var(--ink); }

  .month-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  .month-table th { background: var(--gold-pale); color: #7a5010; padding: 9px; font-weight: 700; border-bottom: 2px solid var(--gold); text-align: center; }
  .month-table td { padding: 8px; border-bottom: 1px solid var(--border); text-align: center; font-size: 12px; }
  .month-table tr.paid-row { background: var(--green-light); }
  .month-table tr.delayed-row { background: var(--red-light); }
  .month-table tr.upcoming-row { background: #f8fafc; }

  #pdf-render-area {
    position: fixed;
    top: -99999px;
    left: -99999px;
    width: 1122px;
    background: #ffffff;
    direction: rtl;
    font-family: 'Cairo', sans-serif;
  }
  .pdf-page {
    width: 1122px;
    min-height: 794px;
    background: #ffffff;
    padding: 30px 40px;
    box-sizing: border-box;
    page-break-after: always;
  }
  .pdf-header {
    background: var(--ink);
    color: #fff;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .pdf-header h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  .pdf-header .pdf-sub { color: var(--gold); font-size: 14px; font-weight: 700; }
  .pdf-header .pdf-meta { color: #b4c8dc; font-size: 12px; margin-top: 6px; }
  .pdf-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .pdf-table thead th {
    background: var(--gold-light);
    color: #7a5010;
    padding: 11px 10px;
    font-weight: 900;
    border-bottom: 2px solid var(--gold);
  }
  .pdf-table tbody td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    font-weight: 600;
    color: var(--ink);
  }
  .pdf-table tbody tr:nth-child(even) { background: #f8fafc; }
  .pdf-footer {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 2px solid var(--gold);
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">نظام <span>المحمدية</span></div>
    <div class="topbar-date" id="today-date"></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button onclick="openAllClientsSummary()" title="عرض التقرير الشامل"
      style="background:rgba(200,146,42,0.2);border:1px solid var(--gold);color:white;padding:5px 10px;border-radius:8px;font-family:Cairo,sans-serif;font-size:12px;cursor:pointer">
      📋 التقرير الشامل
    </button>
    <div style="font-size:12px;color:#2ecc71;font-weight:700;cursor:pointer;" id="sync-status" onclick="loadDataFromCloud()">⏳ جاري الاتصال...</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('home')"><span class="tab-icon">🏠</span>الرئيسية</button>
  <button class="tab-btn" onclick="switchTab('clients')"><span class="tab-icon">👥</span>العملاء</button>
  <button class="tab-btn" onclick="switchTab('add')"><span class="tab-icon">➕</span>إضافة عقد</button>
  <button class="tab-btn" onclick="switchTab('reports')"><span class="tab-icon">📊</span>التقارير</button>
</div>

<!-- HOME -->
<div id="page-home" class="page active">
  <div class="stats-strip" id="stats-strip"></div>
  <div class="section-head"><div class="section-title">المتأخرون عن السداد</div></div>
  <div id="delayed-list"></div>
</div>

<!-- CLIENTS -->
<div id="page-clients" class="page">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="ابحث عن عميل أو كفيل..." oninput="renderClients()">
  </div>
  <div class="filter-chips">
    <span class="chip active" data-filter="all" onclick="setFilter(this,'all')">الكل</span>
    <span class="chip" data-filter="delayed" onclick="setFilter(this,'delayed')">متأخر</span>
    <span class="chip" data-filter="on-track" onclick="setFilter(this,'on-track')">منتظم</span>
    <span class="chip" data-filter="completed" onclick="setFilter(this,'completed')">مكتمل</span>
  </div>
  <div id="clients-list"></div>
</div>

<!-- ADD -->
<div id="page-add" class="page">
  <div class="form-card">
    <div class="section-title" style="margin-bottom:16px;">بيانات العقد الجديد</div>
    <div class="form-group"><label>اسم العميل الكامل *</label><input type="text" id="f-name" placeholder="محمد أحمد العمري"></div>
    <div class="form-group"><label>رقم جوال العميل</label><input type="tel" id="f-phone" inputmode="tel" placeholder="05xxxxxxxx"></div>
    <div class="form-grid">
      <div class="form-group"><label>اسم الكفيل</label><input type="text" id="f-guarantor" placeholder="اسم الكفيل الكامل"></div>
      <div class="form-group"><label>رقم جوال الكفيل</label><input type="tel" id="f-guarantor-phone" inputmode="tel" placeholder="05xxxxxxxx"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>المبلغ الإجمالي (ريال) *</label><input type="number" id="f-total" inputmode="decimal" step="any" placeholder="0.00"></div>
      <div class="form-group"><label>القسط الشهري (ريال) *</label><input type="number" id="f-monthly" inputmode="decimal" step="any" placeholder="0.00"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>تاريخ أول قسط *</label><input type="date" id="f-start"></div>
      <div class="form-group"><label>يوم الاستحقاق (1-28)</label><input type="number" id="f-day" inputmode="numeric" placeholder="20" min="1" max="28"></div>
    </div>
    <div class="form-group"><label>ملاحظات</label><input type="text" id="f-notes" placeholder="أي تفاصيل إضافية..."></div>
    <button class="btn-primary" id="save-btn" onclick="addClient()"><span>💾</span> حفظ العقد سحابياً</button>
  </div>
</div>

<!-- REPORTS -->
<div id="page-reports" class="page">
  <div class="form-card">
    <div class="section-title" style="margin-bottom:14px;">التقرير الشامل والملخص</div>
    <div id="reports-content">جاري التحميل...</div>
  </div>
</div>

<!-- ALL CLIENTS SUMMARY MODAL -->
<div class="modal-overlay" id="all-clients-modal">
  <div class="modal-sheet" style="max-width: 780px;">
    <div class="modal-handle"></div>
    <div class="modal-title">📋 التقرير الشامل لجميع العملاء (جدول واحد)</div>
    
    <div style="max-height: 55vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; background: #fff; margin-bottom: 16px;">
      <table class="month-table" id="all-clients-table">
        <thead>
          <tr>
            <th>#</th>
            <th>اسم العميل والجوال</th>
            <th>الكفيل وجواله</th>
            <th>القسط الشهري</th>
            <th>المتبقي</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="all-clients-table-body"></tbody>
      </table>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button class="btn-primary" style="background:var(--red);margin:0;" onclick="exportAllClientsPDF()">📥 تحميل PDF الشامل</button>
      <button class="btn-secondary" style="margin:0;" onclick="closeAllClientsModal()">إغلاق</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-client-name"></div>
    <div id="modal-body"></div>
    <button class="btn-primary" style="margin-top:16px;background:var(--ink-soft)" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<!-- EDIT CLIENT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">تعديل بيانات العميل</div>
    <input type="hidden" id="e-id">
    <div class="form-group"><label>اسم العميل الكامل *</label><input type="text" id="e-name"></div>
    <div class="form-group"><label>رقم جوال العميل</label><input type="tel" id="e-phone" inputmode="tel"></div>
    <div class="form-grid">
      <div class="form-group"><label>اسم الكفيل</label><input type="text" id="e-guarantor"></div>
      <div class="form-group"><label>رقم جوال الكفيل</label><input type="tel" id="e-guarantor-phone" inputmode="tel"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>المبلغ الإجمالي (ريال) *</label><input type="number" id="e-total" inputmode="decimal" step="any"></div>
      <div class="form-group"><label>القسط الشهري (ريال) *</label><input type="number" id="e-monthly" inputmode="decimal" step="any"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>تاريخ أول قسط *</label><input type="date" id="e-start"></div>
      <div class="form-group"><label>يوم الاستحقاق (1-28)</label><input type="number" id="e-day" inputmode="numeric" min="1" max="28"></div>
    </div>
    <div class="form-group"><label>المبلغ المسدد حتى الآن</label><input type="number" id="e-paid" inputmode="decimal" step="any"></div>
    <div class="form-group"><label>ملاحظات</label><input type="text" id="e-notes"></div>
    <button class="btn-primary" onclick="saveClientEdit()">💾 حفظ التعديلات سحابياً</button>
    <button class="btn-secondary" onclick="closeEditModal()">إلغاء</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="pdf-render-area"></div>

<script>
// ⚠️ ضع هنا رابط Web app URL الخاص بك من Google Apps Script
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycDMom8YvTBG4txLrRht1fgauVGLcnGQsdFJNqzJVzzDoMaGDrtjHKyxNbNNOa9vxi/exec";

let clients = [];
let loaded = false;
let currentFilter = 'all';

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function setStatus(text, color) {
  const el = document.getElementById('sync-status');
  if(el) {
    el.textContent = text;
    el.style.color = color || '#2ecc71';
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function urlIsSet() {
  return SCRIPT_URL.startsWith('https://script.google.com/');
}

async function loadDataFromCloud() {
  if (!urlIsSet()) {
    setStatus('⚠️ رابط السكربت غير مضبوط', '#e74c3c');
    showToast('⚠️ ضع رابط Web app في SCRIPT_URL', 'red');
    return;
  }
  setStatus('⏳ جاري الجلب...', '#f1c40f');
  try {
    const res = await fetch(SCRIPT_URL);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('رد غير متوقع من السكربت');
    
    clients = rows.slice(1).filter(r => r[0] !== '' && r[1] !== '').map(r => ({
      id: r[0],
      name: String(r[1] ?? ''),
      phone: r[2] ? String(r[2]) : '',
      guarantor: r[3] ? String(r[3]) : '',
      guarantorPhone: r[4] ? String(r[4]) : '',
      total: parseFloat(r[5]) || 0,
      monthly: parseFloat(r[6]) || 0,
      paid: parseFloat(r[7]) || 0,
      remaining: parseFloat(r[8]) || 0,
      startDate: r[9] || '',
      dueDay: parseInt(r[10]) || 1,
      notes: r[11] || '',
      paymentsLog: r[12] ? JSON.parse(r[12]) : [],
      discounts: r[13] ? JSON.parse(r[13]) : []
    }));

    loaded = true;
    setStatus('متصل بالسحابة ✅');
    renderHome();
    renderClients();
    if(document.getElementById('page-reports').classList.contains('active')) renderReports();
  } catch (e) {
    console.error(e);
    loaded = false;
    setStatus('⚠️ خطأ بالاتصال (اضغط لإعادة المحاولة)', '#e74c3c');
    showToast('⚠️ تعذر جلب البيانات: ' + e.message, 'red');
  }
}

async function saveToCloud() {
  if (!loaded) {
    showToast('⚠️ لم تُحمَّل البيانات بعد. اضغط على حالة الاتصال لإعادة المحاولة', 'red');
    return false;
  }
  setStatus('💾 جاري الحفظ...', '#f1c40f');
  const rows = [
    ["ID", "الاسم", "الجوال", "الكفيل", "جوال_الكفيل", "الإجمالي", "القسط", "المسدد", "المتبقي", "تاريخ_البداية", "يوم_الاستحقاق", "الملاحظات", "PaymentsLog", "Discounts"]
  ];
  clients.forEach(c => {
    rows.push([
      c.id, c.name, c.phone || '', c.guarantor || '', c.guarantorPhone || '',
      c.total, c.monthly, c.paid, c.remaining, c.startDate, c.dueDay || '',
      c.notes || '', JSON.stringify(c.paymentsLog || []), JSON.stringify(c.discounts || [])
    ]);
  });

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ rows: rows })
    });
    const out = await res.json();
    if (!out.ok) throw new Error('السكربت لم يؤكد الحفظ');
    setStatus('متصل بالسحابة ✅');
    return true;
  } catch (e) {
    console.error(e);
    setStatus('⚠️ خطأ بالحفظ', '#e74c3c');
    showToast('❌ فشل الحفظ: ' + e.message, 'red');
    return false;
  }
}

function today() { return new Date(); }
function fmt(n) { return parseFloat(n || 0).toLocaleString('ar-SA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dateLabel(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ar-SA', { year:'numeric', month:'long', day:'numeric', calendar:'gregory' });
}

function generateSchedule(client) {
  const schedule = [];
  const start = new Date(client.startDate);
  const dueDay = client.dueDay || start.getDate();
  const log = client.paymentsLog || [];

  let remaining = client.total;
  let month = new Date(start.getFullYear(), start.getMonth(), 1);
  let idx = 0;

  while (remaining > 0.001 || idx < log.length) {
    const dueDate = new Date(month.getFullYear(), month.getMonth(),
      Math.min(dueDay, new Date(month.getFullYear(), month.getMonth()+1, 0).getDate()));

    const paid = idx < log.length;
    const logEntry = paid ? (typeof log[idx] === 'string' ? { date: log[idx], amount: client.monthly } : log[idx]) : null;
    const amount = paid ? logEntry.amount : Math.min(client.monthly, remaining);

    remaining = parseFloat((remaining - amount).toFixed(2));
    schedule.push({ idx, dueDate, amount, paid, payDate: paid ? logEntry.date : null, monthName: MONTHS_AR[dueDate.getMonth()] + ' ' + dueDate.getFullYear() });
    month = new Date(month.getFullYear(), month.getMonth() + 1, 1);
    idx++;
    if (idx > 240) break;
  }
  return schedule;
}

function getDelayedMonths(client) {
  const schedule = generateSchedule(client);
  const now = today();
  return schedule.filter(s => !s.paid && s.dueDate < now);
}

function getStatus(client) {
  if (client.remaining <= 0.001) return 'completed';
  const delayed = getDelayedMonths(client);
  return delayed.length > 0 ? 'delayed' : 'on-track';
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2800);
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  event.currentTarget.classList.add('active');
  if (tab === 'home') renderHome();
  if (tab === 'clients') renderClients();
  if (tab === 'reports') renderReports();
}

function renderHome() {
  const totalRem = clients.reduce((s,c) => s + c.remaining, 0);
  const totalPaid = clients.reduce((s,c) => s + c.paid, 0);
  const delayedClients = clients.filter(c => getStatus(c) === 'delayed');

  document.getElementById('stats-strip').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">المتبقي الإجمالي</div>
      <div class="stat-value gold">${fmt(totalRem)} <span class="stat-unit">ر.س</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">إجمالي المسدد</div>
      <div class="stat-value green">${fmt(totalPaid)} <span class="stat-unit">ر.س</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">إجمالي العقود</div>
      <div class="stat-value">${clients.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">متأخرون</div>
      <div class="stat-value red">${delayedClients.length}</div>
    </div>
  `;

  const dl = document.getElementById('delayed-list');
  if (delayedClients.length === 0) {
    dl.innerHTML = `<div style="text-align:center;padding:32px;color:var(--ink-soft)"><div style="font-size:40px;margin-bottom:10px">🎉</div><p>لا يوجد عملاء متأخرون حالياً</p></div>`;
    return;
  }
  dl.innerHTML = delayedClients.map(c => clientCardHTML(c)).join('');
}

function setFilter(el, val) {
  currentFilter = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderClients();
}

function renderClients() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  let list = clients;
  if (q) {
    list = list.filter(c => 
      c.name.toLowerCase().includes(q) || 
      (c.phone||'').includes(q) || 
      (c.guarantor||'').toLowerCase().includes(q) || 
      (c.guarantorPhone||'').includes(q)
    );
  }
  if (currentFilter === 'delayed') list = list.filter(c => getStatus(c) === 'delayed');
  else if (currentFilter === 'on-track') list = list.filter(c => getStatus(c) === 'on-track');
  else if (currentFilter === 'completed') list = list.filter(c => getStatus(c) === 'completed');

  const container = document.getElementById('clients-list');
  if (list.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:32px;color:var(--ink-soft)"><div style="font-size:40px;margin-bottom:10px">📋</div><p>لا توجد نتائج مطابقة</p></div>`;
    return;
  }
  container.innerHTML = list.map(c => clientCardHTML(c)).join('');
}

function clientCardHTML(client) {
  const status = getStatus(client);
  const statusLabels = { completed: ['مكتمل','badge-completed'], delayed: ['متأخر','badge-delayed'], 'on-track': ['منتظم','badge-on-track'] };
  const [label, badgeClass] = statusLabels[status];
  const pct = Math.min(100, ((client.paid / client.total) * 100)).toFixed(0);
  const delayed = getDelayedMonths(client);

  return `<div class="client-card ${status}">
    <div class="client-head">
      <div>
        <div class="client-name">${esc(client.name)}</div>
        ${client.phone ? `<div class="client-phone">📱 العميل: <a href="tel:${esc(client.phone)}">${esc(client.phone)}</a></div>` : ''}
        ${client.guarantor ? `<div class="client-phone">🤝 الكفيل: ${esc(client.guarantor)}${client.guarantorPhone ? `(<a href="tel:${esc(client.guarantorPhone)}">${esc(client.guarantorPhone)}</a>)` : ''}</div>` : ''}
      </div>
      <span class="status-badge ${badgeClass}">${label}</span>
    </div>
    <div class="client-body">
      <div class="progress-wrap">
        <div class="progress-labels">
          <span>المسدد ${fmt(client.paid)} ر.س</span>
          <span>${pct}%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="lbl">الإجمالي</div><div class="val">${fmt(client.total)} ر.س</div></div>
        <div class="info-item"><div class="lbl">القسط</div><div class="val">${fmt(client.monthly)} ر.س</div></div>
        <div class="info-item"><div class="lbl">المتبقي</div><div class="val danger">${fmt(client.remaining)} ر.س</div></div>
        <div class="info-item" style="grid-column:1/-1"><div class="lbl">الأشهر المتأخرة</div><div class="val ${delayed.length > 0 ? 'danger' : 'success'}">${delayed.length > 0 ? `⚠️ ${delayed.length} شهر (${delayed.map(d => d.monthName).join(', ')})` : 'لا توجد تأخيرات'}</div></div>
      </div>
    </div>
    <div class="client-actions">
      ${status !== 'completed' ? `<button class="action-btn btn-pay" onclick="payInstallment('${esc(client.id)}')">💵 تحصيل</button>` : ''}
      <button class="action-btn btn-discount" onclick="addDiscount('${esc(client.id)}')">🏷️ خصم</button>
      <button class="action-btn btn-details" onclick="openDetail('${esc(client.id)}')">📋 التفاصيل</button>
      <button class="action-btn btn-edit" onclick="openEditModal('${esc(client.id)}')">✏️ تعديل</button>
      <button class="action-btn btn-del" onclick="deleteClient('${esc(client.id)}')">🗑️</button>
    </div>
  </div>`;
}

async function exportAllClientsPDF() {
  if (clients.length === 0) return;
  showToast('⏳ جاري إنشاء ملف PDF...', '');

  const renderArea = document.getElementById('pdf-render-area');
  const ROWS_PER_PAGE = 15;
  const pages = [];
  for (let i = 0; i < clients.length; i += ROWS_PER_PAGE) pages.push(clients.slice(i, i + ROWS_PER_PAGE));

  renderArea.innerHTML = pages.map((pageClients, pIdx) => `
    <div class="pdf-page" id="pdf-full-page-${pIdx}">
      <div class="pdf-header">
        <h1>التقرير الشامل لجميع العملاء والكفلاء</h1>
        <div class="pdf-sub">نظام المحمدية</div>
        <div class="pdf-meta">تاريخ التقرير: ${new Date().toLocaleDateString('ar-SA')} &nbsp;|&nbsp; إجمالي العملاء: ${clients.length} &nbsp;|&nbsp; صفحة ${pIdx + 1} من ${pages.length}</div>
      </div>
      <table class="pdf-table">
        <thead>
          <tr>
            <th>#</th>
            <th style="text-align:right;">اسم العميل والجوال</th>
            <th style="text-align:right;">الكفيل وجواله</th>
            <th>القسط الشهري</th>
            <th>المتبقي</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody>
          ${pageClients.map((c, i) => {
            let rowIdx = pIdx * ROWS_PER_PAGE + i + 1;
            const status = getStatus(c);
            const label = status === 'completed' ? 'مكتمل' : (status === 'delayed' ? 'متأخر' : 'منتظم');
            return `<tr>
              <td>${rowIdx}</td>
              <td style="text-align:right;font-weight:700">${esc(c.name)}<br><small>${esc(c.phone || '')}</small></td>
              <td style="text-align:right">${esc(c.guarantor \vert{}\vert{} '—')}<br><small>${esc(c.guarantorPhone || '')}</small></td>
              <td><b>${fmt(c.monthly)} ر.س</b></td>
              <td>${fmt(c.remaining)} ر.س</td>
              <td>${label}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="pdf-footer">
        <span>نظام المحمدية لإدارة الأقساط</span>
        <span>صفحة ${pIdx + 1} من ${pages.length}</span>
      </div>
    </div>
  `).join('');

  await new Promise(r => setTimeout(r, 120));
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

  for (let pIdx = 0; pIdx < pages.length; pIdx++) {
    const pageEl = document.getElementById(`pdf-full-page-${pIdx}`);
    const canvas = await html2canvas(pageEl, { scale: 3, useCORS: true, backgroundColor: '#ffffff' });
    const imgData = canvas.toDataURL('image/jpeg', 1.0);
    if (pIdx > 0) doc.addPage();
    doc.addImage(imgData, 'JPEG', 0, 0, 297, 210);
  }

  renderArea.innerHTML = '';
  doc.save(`التقرير_الشامل_${new Date().toISOString().split('T')[0]}.pdf`);
  showToast('✅ تم تحميل ملف PDF الشامل', 'green');
}

async function addClient() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const guarantor = document.getElementById('f-guarantor').value.trim();
  const guarantorPhone = document.getElementById('f-guarantor-phone').value.trim();
  const total = parseFloat(document.getElementById('f-total').value) || 0;
  const monthly = parseFloat(document.getElementById('f-monthly').value) || 0;
  const startDate = document.getElementById('f-start').value;
  const dueDay = parseInt(document.getElementById('f-day').value) || 1;
  const notes = document.getElementById('f-notes').value.trim();

  if (!name || !total || !monthly || !startDate) {
    showToast('⚠️ يرجى ملء الحقول المطلوبة', 'red'); return;
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  const backup = clients.slice();

  clients.push({
    id: Date.now(), name, phone, guarantor, guarantorPhone, total, monthly,
    remaining: total, paid: 0, startDate, dueDay,
    notes, paymentsLog: [], discounts: []
  });

  const ok = await saveToCloud();
  btn.disabled = false;
  if (!ok) { clients = backup; return; }

  showToast('✅ تم الحفظ في قوقل شيت بنجاح', 'green');
  ['f-name','f-phone','f-guarantor','f-guarantor-phone','f-total','f-monthly','f-start','f-day','f-notes'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  switchTab('clients');
}

  document.getElementById('e-id').value = c.id;
  document.getElementById('e-name').value = c.name;
  document.getElementById('e-phone').value = c.phone || '';
  document.getElementById('e-guarantor').value = c.guarantor || '';
  document.getElementById('e-guarantor-phone').value = c.guarantorPhone || '';
  document.getElementById('e-total').value = c.total;
  document.getElementById('e-monthly').value = c.monthly;
  document.getElementById('e-start').value = c.startDate;
  document.getElementById('e-day').value = c.dueDay || '';
  document.getElementById('e-paid').value = c.paid;
  document.getElementById('e-notes').value = c.notes || '';
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); }

async function saveClientEdit() {
  const id = parseInt(document.getElementById('e-id').value);
  const name = document.getElementById('e-name').value.trim();
  const phone = document.getElementById('e-phone').value.trim();
  const guarantor = document.getElementById('e-guarantor').value.trim();
  const guarantorPhone = document.getElementById('e-guarantor-phone').value.trim();
  const total = parseFloat(document.getElementById('e-total').value) || 0;
  const monthly = parseFloat(document.getElementById('e-monthly').value) || 0;
  const startDate = document.getElementById('e-start').value;
  const dueDay = parseInt(document.getElementById('e-day').value) || 1;
  const paid = parseFloat(document.getElementById('e-paid').value) || 0;
  const notes = document.getElementById('e-notes').value.trim();

  const backup = clients.slice();
  clients = clients.map(c => {
    if (String(c.id) !== String(id)) return c;
    const totalDiscount = (c.discounts || []).reduce((s,d)=>s+d.amount, 0);
    return {
      ...c, name, phone, guarantor, guarantorPhone, total, monthly, startDate, dueDay, notes,
      paid: parseFloat(paid.toFixed(2)),
      remaining: parseFloat((total - paid - totalDiscount).toFixed(2))
    };
  });

  const ok = await saveToCloud();
  if (!ok) { clients = backup; return; }

  closeEditModal();
  showToast('✅ تم التعديل والتحديث سحابياً', 'green');
  renderHome();
  renderClients();
}

async function payInstallment(id) {
  const client = clients.find(x => String(x.id) === String(id));
  if (!client) return;
  const suggested = Math.min(client.monthly, client.remaining);
  const input = prompt('أدخل المبلغ المستحصل (ريال):', suggested.toFixed(2));
  if (input === null) return;
  const amount = parseFloat(input);
  if (isNaN(amount) || amount <= 0) return showToast('⚠️ مبلغ غير صالح', 'red');

  const oldPaid = client.paid, oldRem = client.remaining, oldLog = [...(client.paymentsLog || [])];
  const nowStr = new Date().toISOString().split('T')[0];

  client.remaining = parseFloat((client.remaining - amount).toFixed(2));
  client.paid = parseFloat((client.paid + amount).toFixed(2));
  if (!client.paymentsLog) client.paymentsLog = [];
  client.paymentsLog.push({ date: nowStr, amount: parseFloat(amount.toFixed(2)) });

  const ok = await saveToCloud();
  if (!ok) {
    client.paid = oldPaid;
    client.remaining = oldRem;
    client.paymentsLog = oldLog;
    return;
  }

  showToast('💰 تم تسجيل التحصيل وتحديث السحابة', 'green');
  renderHome();
  renderClients();
}

async function addDiscount(id) {
  const client = clients.find(x => String(x.id) === String(id));
  if (!client) return;
  const input = prompt('أدخل مبلغ الخصم:', '0.00');
  if (input === null) return;
  const amt = parseFloat(input);
  if (isNaN(amt) || amt <= 0) return showToast('⚠️ مبلغ غير صالح', 'red');

  const oldRem = client.remaining, oldDisc = [...(client.discounts || [])];
  if (!client.discounts) client.discounts = [];
  client.discounts.push({ date: new Date().toISOString().split('T')[0], amount: amt, reason: 'خصم' });
  const totalDiscount = client.discounts.reduce((s,d)=>s+d.amount, 0);
  client.remaining = parseFloat((client.total - client.paid - totalDiscount).toFixed(2));

  const ok = await saveToCloud();
  if (!ok) {
    client.remaining = oldRem;
    client.discounts = oldDisc;
    return;
  }

  showToast('🏷️ تم إضافة الخصم سحابياً', 'green');
  renderHome();
  renderClients();
}

async function deleteClient(id) {
  if (!confirm('هل أنت متأكد من الحذف؟')) return;
  const backup = clients.slice();
  clients = clients.filter(x => String(x.id) !== String(id));

  const ok = await saveToCloud();
  if (!ok) { clients = backup; return; }

  renderHome();
  renderClients();
  showToast('🗑️ تم الحذف والتحديث سحابياً', 'green');
}

function openDetail(id) {
  const c = clients.find(x => String(x.id) === String(id));
  if (!c) return;
  document.getElementById('modal-client-name').textContent = c.name;
  const schedule = generateSchedule(c);
  const rows = schedule.map(s => `
    <tr class="${s.paid ? 'paid-row' : (s.dueDate < today() ? 'delayed-row' : 'upcoming-row')}">
      <td>${s.idx + 1}</td>
      <td>${dateLabel(s.dueDate)}</td>
      <td>${fmt(s.amount)} ر.س</td>
      <td>${s.paid ? '✅ مدفوع' : (s.dueDate < today() ? '⚠️ متأخر' : '🔜 قادم')}</td>
    </tr>
  `).join('');

  document.getElementById('modal-body').innerHTML = `
    ${c.guarantor ? `<div>🤝 الكفيل: <b>${esc(c.guarantor)}</b> (${esc(c.guarantorPhone || 'بدون جوال')})</div><br>` : ''}
    <table class="month-table">
      <thead><tr><th>#</th><th>التاريخ</th><th>المبلغ</th><th>الحالة</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  document.getElementById('detail-modal').classList.add('open');
}

function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }

function renderReports() {
  const totalRem = clients.reduce((s,c) => s + c.remaining, 0);
  const totalPaid = clients.reduce((s,c) => s + c.paid, 0);
  const totalSum = clients.reduce((s,c) => s + c.total, 0);

  document.getElementById('reports-content').innerHTML = `
    <div style="display:grid;gap:10px;font-size:14px; margin-bottom:16px;">
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>إجمالي العقود:</span><strong>${clients.length}</strong></div>
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>إجمالي المبالغ:</span><strong>${fmt(totalSum)} ر.س</strong></div>
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>المسدد فعلياً:</span><strong style="color:var(--green);">${fmt(totalPaid)} ر.س</strong></div>
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>المتبقي:</span><strong style="color:var(--red);">${fmt(totalRem)} ر.س</strong></div>
    </div>
    <button class="btn-primary" onclick="openAllClientsSummary()">📋 عرض وعمل PDF التقرير الشامل</button>
  `;
}

function init() {
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ar-SA', { weekday:'long', year:'numeric', month:'long', day:'numeric', calendar:'gregory' });
  loadDataFromCloud();
}
init();
</script>
</body>
</html>
