<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام المحمدية السحابي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');

  :root {
    --ink: #0f1923;
    --ink-soft: #3d5166;
    --gold: #c8922a;
    --gold-light: #f5e8d0;
    --gold-pale: #fdf8f0;
    --teal: #0d6b6b;
    --teal-light: #e0f2f1;
    --red: #c0392b;
    --red-light: #fdecea;
    --green: #1a7a4a;
    --green-light: #e8f5ee;
    --surface: #ffffff;
    --bg: #f4f6f9;
    --border: #dde3ec;
    --shadow: 0 2px 12px rgba(15,25,35,0.08);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  .topbar {
    background: var(--ink);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .topbar-title { font-size: 17px; font-weight: 700; }
  .topbar-title span { color: var(--gold); }
  .topbar-date { font-size: 12px; color: #8fa0b4; }

  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 57px;
    z-index: 99;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 1;
    min-width: 90px;
    padding: 13px 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-btn .tab-icon { font-size: 16px; display: block; margin-bottom: 2px; }

  .page { display: none; padding: 16px; padding-bottom: 80px; }
  .page.active { display: block; }

  .stats-strip {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .stat-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 900; color: var(--ink); }
  .stat-value.gold { color: var(--gold); }
  .stat-value.red { color: var(--red); }
  .stat-value.green { color: var(--green); }
  .stat-unit { font-size: 11px; font-weight: 400; color: var(--ink-soft); }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 18px;
    background: var(--gold);
    border-radius: 2px;
  }

  .form-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 12px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #f8fafc;
    outline: none;
  }
  input:focus { border-color: var(--gold); background: white; }
  
  .btn-primary {
    background: var(--ink);
    color: white;
    border: none;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }

  .client-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .client-card.delayed { border-right: 4px solid var(--red); }
  .client-card.completed { border-right: 4px solid var(--green); }
  .client-card.on-track { border-right: 4px solid var(--gold); }

  .client-head { padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: flex-start; }
  .client-name { font-size: 16px; font-weight: 700; color: var(--ink); }
  .client-phone { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .client-phone a { color: inherit; text-decoration: none; }

  .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-completed { background: var(--green-light); color: var(--green); }
  .badge-delayed { background: var(--red-light); color: var(--red); }
  .badge-on-track { background: var(--gold-light); color: #8a5c0e; }

  .client-body { padding: 0 16px 14px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12.5px; }
  .info-item .lbl { color: var(--ink-soft); font-size: 11px; }
  .info-item .val { font-weight: 700; color: var(--ink); font-size: 13px; }
  .info-item .val.danger { color: var(--red); }
  .info-item .val.success { color: var(--green); }

  .progress-wrap { margin: 12px 0 10px; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 5px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 4px; }

  .client-actions { display: flex; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .action-btn { flex: 1; min-width: 60px; padding: 9px 6px; border-radius: 8px; border: none; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .btn-pay { background: var(--teal-light); color: var(--teal); }
  .btn-details { background: var(--gold-light); color: #7a5010; }
  .btn-del { background: var(--red-light); color: var(--red); flex: 0 0 42px !important; }

  .search-box { position: relative; margin-bottom: 14px; }
  .search-box input { background: white; padding-right: 40px; }
  .search-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; }

  .filter-chips { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: white; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
  .chip.active { background: var(--ink); color: white; border-color: var(--ink); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,25,35,0.6); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 16px; text-align: center; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 999; transition: transform 0.3s; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">نظام <span>المحمدية</span> (سحابي ☁️)</div>
    <div class="topbar-date" id="today-date"></div>
  </div>
  <div style="font-size:12px;color:#2ecc71;font-weight:700;">متصل بالسحابة ✅</div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('home')"><span class="tab-icon">🏠</span>الرئيسية</button>
  <button class="tab-btn" onclick="switchTab('clients')"><span class="tab-icon">👥</span>العملاء</button>
  <button class="tab-btn" onclick="switchTab('add')"><span class="tab-icon">➕</span>إضافة عقد</button>
</div>

<!-- HOME -->
<div id="page-home" class="page active">
  <div class="stats-strip" id="stats-strip"></div>
  <div class="section-head"><div class="section-title">ملخص الحسابات</div></div>
  <div id="delayed-list"></div>
</div>

<!-- CLIENTS -->
<div id="page-clients" class="page">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="ابحث عن عميل..." oninput="renderClients()">
  </div>
  <div id="clients-list"></div>
</div>

<!-- ADD -->
<div id="page-add" class="page">
  <div class="form-card">
    <div class="section-title" style="margin-bottom:16px;">بيانات العقد الجديد</div>
    <div class="form-group"><label>اسم العميل الكامل *</label><input type="text" id="f-name" placeholder="محمد أحمد"></div>
    <div class="form-group"><label>رقم جوال العميل</label><input type="tel" id="f-phone" placeholder="05xxxxxxxx"></div>
    <div class="form-grid">
      <div class="form-group"><label>اسم الكفيل</label><input type="text" id="f-guarantor" placeholder="اسم الكفيل"></div>
      <div class="form-group"><label>رقم جوال الكفيل</label><input type="tel" id="f-guarantor-phone" placeholder="05xxxxxxxx"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>المبلغ الإجمالي (ريال) *</label><input type="number" id="f-total" placeholder="0.00"></div>
      <div class="form-group"><label>القسط الشهري (ريال) *</label><input type="number" id="f-monthly" placeholder="0.00"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>تاريخ أول قسط *</label><input type="date" id="f-start"></div>
      <div class="form-group"><label>يوم الاستحقاق</label><input type="number" id="f-day" placeholder="20" min="1" max="28"></div>
    </div>
    <div class="form-group"><label>ملاحظات</label><input type="text" id="f-notes" placeholder="ملاحظات..."></div>
    <button class="btn-primary" onclick="addClient()"><span>💾</span> حفظ العقد سحابياً</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTh-4W9evNCSX0C-9CyxfezSLZzt342-brgMd04p4fzjB06LukYBCuXH80ckLpni/exec";

let clients = [];

async function loadDataFromCloud() {
  showToast('⏳ جاري جلب البيانات من قوقل شيت...', '');
  try {
    const res = await fetch(SCRIPT_URL);
    const rows = await res.json();
    if (rows && rows.length > 1) {
      clients = rows.slice(1).map(r => ({
        id: r[0],
        name: r[1],
        phone: r[2],
        guarantor: r[3],
        guarantorPhone: r[4],
        total: parseFloat(r[5]) || 0,
        monthly: parseFloat(r[6]) || 0,
        paid: parseFloat(r[7]) || 0,
        remaining: parseFloat(r[8]) || 0,
        startDate: r[9],
        dueDay: r[10],
        notes: r[11],
        paymentsLog: []
      }));
    }
    renderHome();
    renderClients();
    showToast('✅ تم تحديث البيانات من السحابة بنجاح', 'green');
  } catch(e) {
    showToast('⚠️ خطأ في الاتصال بالسحابة', 'red');
  }
}

async function saveToCloud() {
  const rows = [
    ["ID", "الاسم", "الجوال", "الكفيل", "جوال_الكفيل", "الإجمالي", "القسط", "المسدد", "المتبقي", "تاريخ_البداية", "يوم_الاستحقاق", "الملاحظات"]
  ];
  clients.forEach(c => {
    rows.push([c.id, c.name, c.phone || '', c.guarantor || '', c.guarantorPhone || '', c.total, c.monthly, c.paid, c.remaining, c.startDate, c.dueDay || '', c.notes || '']);
  });

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sheetName: "Sheet1", rows: rows })
    });
  } catch(e) {
    console.error(e);
  }
}

function fmt(n) { return parseFloat(n || 0).toLocaleString('ar-SA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2800);
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  event.currentTarget.classList.add('active');
  if (tab === 'home') renderHome();
  if (tab === 'clients') renderClients();
}

function renderHome() {
  const totalRem = clients.reduce((s,c) => s + c.remaining, 0);
  const activeCount = clients.filter(c => c.remaining > 0.001).length;
  
  document.getElementById('stats-strip').innerHTML = `
    <div class="stat-card"><div class="stat-label">المبلغ الإجمالي المتبقي</div><div class="stat-value gold">${fmt(totalRem)} <span class="stat-unit">ر.س</span></div></div>
    <div class="stat-card"><div class="stat-label">العملاء النشطون</div><div class="stat-value">${activeCount}</div></div>
  `;

  const dl = document.getElementById('delayed-list');
  if(clients.length === 0) {
    dl.innerHTML = `<div style="text-align:center;padding:30px;color:var(--ink-soft)">لا توجد بيانات مسجلة حالياً</div>`;
    return;
  }
  dl.innerHTML = clients.map(c => clientCardHTML(c)).join('');
}

function renderClients() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  let list = clients;
  if(q) list = list.filter(c => c.name.toLowerCase().includes(q) || (c.phone||'').includes(q));
  
  const container = document.getElementById('clients-list');
  if(list.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:30px;color:var(--ink-soft)">لا توجد نتائج</div>`;
    return;
  }
  container.innerHTML = list.map(c => clientCardHTML(c)).join('');
}

function clientCardHTML(client) {
  const pct = Math.min(100, ((client.paid / client.total) * 100)).toFixed(0);
  return `<div class="client-card on-track">
    <div class="client-head">
      <div>
        <div class="client-name">${client.name}</div>
        ${client.phone ? `<div class="client-phone">📱 <a href="tel:${client.phone}">${client.phone}</a></div>` : ''}
      </div>
      <span class="status-badge badge-on-track">نشط</span>
    </div>
    <div class="client-body">
      <div class="progress-wrap">
        <div class="progress-labels"><span>المسدد ${fmt(client.paid)} ر.س</span><span>${pct}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="lbl">الإجمالي</div><div class="val">${fmt(client.total)} ر.س</div></div>
        <div class="info-item"><div class="lbl">المتبقي</div><div class="val danger">${fmt(client.remaining)} ر.س</div></div>
      </div>
    </div>
    <div class="client-actions">
      <button class="action-btn btn-pay" onclick="payInstallment(${client.id})">💵 تحصيل</button>
      <button class="action-btn btn-del" onclick="deleteClient(${client.id})">🗑️ حذف</button>
    </div>
  </div>`;
}

async function addClient() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const guarantor = document.getElementById('f-guarantor').value.trim();
  const guarantorPhone = document.getElementById('f-guarantor-phone').value.trim();
  const total = parseFloat(document.getElementById('f-total').value) || 0;
  const monthly = parseFloat(document.getElementById('f-monthly').value) || 0;
  const startDate = document.getElementById('f-start').value;
  const dueDay = parseInt(document.getElementById('f-day').value) || '';
  const notes = document.getElementById('f-notes').value.trim();

  if (!name || !total || !monthly || !startDate) {
    showToast('⚠️ يرجى ملء الحقول المطلوبة', 'red'); return;
  }

  clients.push({
    id: Date.now(), name, phone, guarantor, guarantorPhone, total, monthly, remaining: total, paid: 0, startDate, dueDay, notes
  });
  
  await saveToCloud();
  showToast('✅ تم حفظ العقد سحابياً بنجاح', 'green');
  switchTab('clients');
}

async function payInstallment(id) {
  const client = clients.find(c => c.id == id);
  if (!client) return;
  const amount = parseFloat(prompt('أدخل المبلغ المستحصل (ريال):', client.monthly));
  if (isNaN(amount) || amount <= 0) return;

  client.remaining = Math.max(0, client.remaining - amount);
  client.paid += amount;

  await saveToCloud();
  showToast('💰 تم تسجيل القسط وحفظه في السحابة', 'green');
  renderHome();
  renderClients();
}

async function deleteClient(id) {
  if (!confirm('هل أنت متأكد من الحذف؟')) return;
  clients = clients.filter(c => c.id != id);
  await saveToCloud();
  renderHome();
  renderClients();
  showToast('🗑️ تم الحذف والتحديث سحابياً', 'green');
}

document.getElementById('today-date').textContent = new Date().toLocaleDateString('ar-SA');
loadDataFromCloud();
</script>
</body>
</html>
