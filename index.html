<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام المحمدية (نسخة احترافية وآمنة)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --ink: #0f1923; --ink-soft: #3d5166; --gold: #c8922a; --gold-light: #f5e8d0;
    --gold-pale: #fdf8f0; --teal: #0d6b6b; --teal-light: #e0f2f1; --red: #c0392b;
    --red-light: #fdecea; --green: #1a7a4a; --green-light: #e8f5ee; --surface: #ffffff;
    --bg: #f4f6f9; --border: #dde3ec; --shadow: 0 2px 12px rgba(15,25,35,0.08); --radius: 14px;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', -apple-system, 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
 .topbar { background: var(--ink); color: white; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
 .topbar-title { font-size: 17px; font-weight: 700; }
 .topbar-title span { color: var(--gold); }
 .topbar-date { font-size: 12px; color: #8fa0b4; }
 .tabs { display: flex; background: var(--surface); border-bottom: 2px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 57px; z-index: 99; }
 .tabs::-webkit-scrollbar { display: none; }
 .tab-btn { flex: 1; min-width: 90px; padding: 13px 10px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; background: none; border: none; cursor: pointer; color: var(--ink-soft); border-bottom: 3px solid transparent; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
 .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
 .tab-btn.tab-icon { font-size: 16px; display: block; margin-bottom: 2px; }
 .page { display: none; padding: 16px; padding-bottom: 80px; }
 .page.active { display: block; }
 .stats-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
 .stat-card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
 .stat-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
 .stat-value { font-size: 20px; font-weight: 900; color: var(--ink); }
 .stat-value.gold { color: var(--gold); }
 .stat-value.red { color: var(--red); }
 .stat-value.green { color: var(--green); }
 .stat-unit { font-size: 11px; font-weight: 400; color: var(--ink-soft); margin-right: 2px; }
 .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
 .section-title { font-size: 15px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; }
 .section-title::before { content: ''; display: block; width: 4px; height: 18px; background: var(--gold); border-radius: 2px; }
 .form-card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 16px; }
 .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
 .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  input, select, textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; color: var(--ink); background: #f8fafc; outline: none; }
  input:focus, select:focus { border-color: var(--gold); background: white; }
 .btn-primary { background: var(--ink); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
 .btn-secondary { background: var(--gold-light); color: #7a5010; border: none; width: 100%; padding: 14px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
 .client-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
 .client-card.delayed { border-right: 4px solid var(--red); }
 .client-card.completed { border-right: 4px solid var(--green); }
 .client-card.on-track { border-right: 4px solid var(--gold); }
 .client-head { padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: flex-start; }
 .client-name { font-size: 16px; font-weight: 700; color: var(--ink); }
 .client-phone { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
 .client-phone a { color: inherit; text-decoration: none; }
 .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
 .badge-completed { background: var(--green-light); color: var(--green); }
 .badge-delayed { background: var(--red-light); color: var(--red); }
 .badge-on-track { background: var(--gold-light); color: #8a5c0e; }
 .client-body { padding: 0 16px 14px; }
 .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12.5px; }
 .info-item.lbl { color: var(--ink-soft); font-size: 11px; }
 .info-item.val { font-weight: 700; color: var(--ink); font-size: 13px; }
 .info-item.val.danger { color: var(--red); }
 .info-item.val.success { color: var(--green); }
 .progress-wrap { margin: 12px 0 10px; }
 .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 5px; }
 .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
 .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 4px; }
 .client-actions { display: flex; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
 .action-btn { flex: 1; min-width: 60px; padding: 9px 6px; border-radius: 8px; border: none; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
 .btn-pay { background: var(--teal-light); color: var(--teal); }
 .btn-discount { background: #fdf3e3; color: #b7791f; }
 .btn-details { background: var(--gold-light); color: #7a5010; }
 .btn-edit { background: #e6edf7; color: #2952a3; }
 .btn-del { background: var(--red-light); color: var(--red); flex: 0 0 42px!important; }
 .search-box { position: relative; margin-bottom: 14px; }
 .search-box input { background: white; padding-right: 40px; }
 .search-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
 .filter-chips { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
 .filter-chips::-webkit-scrollbar { display: none; }
 .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: white; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
 .chip.active { background: var(--ink); color: white; border-color: var(--ink); }
 .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,25,35,0.6); z-index: 200; align-items: flex-end; justify-content: center; }
 .modal-overlay.open { display: flex; }
 .modal-sheet { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; }
 .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
 .modal-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 16px; text-align: center; }
 .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 999; transition: transform 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.3); max-width: 92vw; text-align: center; }
 .toast.show { transform: translateX(-50%) translateY(0); }
 .toast.green { background: var(--green); }
 .toast.red { background: var(--red); }
 .toast.yellow { background: #f1c40f; color: var(--ink); }
 .quick-reports-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
 .quick-report-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; box-shadow: var(--shadow); font-family: 'Cairo', sans-serif; }
 .month-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
 .month-table th { background: var(--gold-pale); color: #7a5010; padding: 9px; font-weight: 700; border-bottom: 2px solid var(--gold); text-align: center; }
 .month-table td { padding: 8px; border-bottom: 1px solid var(--border); text-align: center; font-size: 12px; }
  #pdf-render-area { position: fixed; top: -99999px; left: -99999px; width: 1122px; background: #ffffff; direction: rtl; font-family: 'Cairo', sans-serif; }
 .pdf-page { width: 1122px; min-height: 794px; background: #ffffff; padding: 30px 40px; box-sizing: border-box; page-break-after: always; }
 .pdf-header { background: var(--ink); color: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; position: relative; }
 .pdf-header h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
 .pdf-header.pdf-sub { color: var(--gold); font-size: 14px; font-weight: 700; }
 .pdf-header.pdf-meta { color: #b4c8dc; font-size: 12px; margin-top: 6px; }
 .pdf-table { width: 100%; border-collapse: collapse; font-size: 14px; }
 .pdf-table thead th { background: var(--gold-light); color: #7a5010; padding: 11px 10px; font-weight: 900; border-bottom: 2px solid var(--gold); }
 .pdf-table tbody td { padding: 10px; border-bottom: 1px solid var(--border); text-align: center; font-weight: 600; color: var(--ink); }
 .pdf-footer { margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--gold); font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; }
  #lock-screen { position: fixed; inset: 0; background: var(--ink); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 24px; }
 .lock-box { background: var(--surface); border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
 .log-entry { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; background: var(--bg); border-radius: 8px; margin-bottom: 6px; font-size: 12.5px; }
 .le-btn { border: none; background: #e6edf7; color: #2952a3; border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer; font-family: 'Cairo', sans-serif; }
 .le-btn.le-del { background: var(--red-light); color: var(--red); }
 .subsection-title { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin: 14px 0 8px; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-icon" style="font-size:40px;margin-bottom:10px;">🔒</div>
    <div class="lock-title" id="lock-title" style="font-size:17px;font-weight:700;margin-bottom:4px;">أدخل رمز الدخول</div>
    <div class="lock-sub" id="lock-sub" style="font-size:12px;color:var(--ink-soft);margin-bottom:18px;">نظام المحمدية محمي برمز دخول محلي</div>
    <input type="password" id="lock-input" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" autocomplete="off">
    <input type="password" id="lock-input-confirm" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="تأكيد الرمز" autocomplete="off" style="display:none">
    <div class="lock-error" id="lock-error" style="color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px;"></div>
    <button class="btn-primary" onclick="submitLock()" style="margin-top:4px;">دخول</button>
  </div>
</div>

<div class="topbar">
  <div>
    <div class="topbar-title">نظام <span>المحمدية</span></div>
    <div class="topbar-date" id="today-date"></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button onclick="openAllClientsSummary()" title="عرض التقرير الشامل"
      style="background:rgba(200,146,42,0.2);border:1px solid var(--gold);color:white;padding:5px 10px;border-radius:8px;font-family:Cairo,sans-serif;font-size:12px;cursor:pointer">
      📋 التقرير
    </button>
    <div style="font-size:12px;color:#2ecc71;font-weight:700;cursor:pointer;" id="sync-status" onclick="loadDataFromCloud(true)">🔄 مزامنة سحابية</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="home" onclick="switchTab('home')"><span class="tab-icon">🏠</span>الرئيسية</button>
  <button class="tab-btn" data-tab="clients" onclick="switchTab('clients')"><span class="tab-icon">👥</span>العملاء</button>
  <button class="tab-btn" data-tab="add" onclick="switchTab('add')"><span class="tab-icon">➕</span>إضافة عقد</button>
  <button class="tab-btn" data-tab="reports" onclick="switchTab('reports')"><span class="tab-icon">📊</span>التقارير والأمان</button>
</div>

<div id="page-home" class="page active">
  <div class="stats-strip" id="stats-strip"></div>
  <div class="section-head"><div class="section-title">المتأخرون عن السداد</div></div>
  <div id="delayed-list"></div>
</div>

<div id="page-clients" class="page">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="ابحث عن عميل أو كفيل..." oninput="debouncedSearch()">
  </div>
  <div class="filter-chips">
    <span class="chip active" data-filter="all" onclick="setFilter(this,'all')">الكل</span>
    <span class="chip" data-filter="delayed" onclick="setFilter(this,'delayed')">متأخر</span>
    <span class="chip" data-filter="on-track" onclick="setFilter(this,'on-track')">منتظم</span>
    <span class="chip" data-filter="completed" onclick="setFilter(this,'completed')">مكتمل</span>
  </div>
  <div id="clients-list"></div>
</div>

<div id="page-add" class="page">
  <div class="form-card">
    <div class="section-title" style="margin-bottom:16px;">بيانات العقد الجديد</div>
    <div class="form-group"><label>اسم العميل الكامل *</label><input type="text" id="f-name" placeholder="محمد أحمد العمري"></div>
    <div class="form-group"><label>رقم جوال العميل</label><input type="tel" id="f-phone" inputmode="tel" placeholder="05xxxxxxxx"></div>
    <div class="form-grid">
      <div class="form-group"><label>اسم الكفيل</label><input type="text" id="f-guarantor" placeholder="اسم الكفيل الكامل"></div>
      <div class="form-group"><label>رقم جوال الكفيل</label><input type="tel" id="f-guarantor-phone" inputmode="tel" placeholder="05xxxxxxxx"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>المبلغ الإجمالي (ريال) *</label><input type="number" id="f-total" inputmode="decimal" step="any" placeholder="0.00"></div>
      <div class="form-group"><label>القسط الشهري (ريال) *</label><input type="number" id="f-monthly" inputmode="decimal" step="any" placeholder="0.00"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>تاريخ أول قسط *</label><input type="date" id="f-start"></div>
      <div class="form-group"><label>يوم الاستحقاق (1-28)</label><input type="number" id="f-day" inputmode="numeric" placeholder="20" min="1" max="28"></div>
    </div>
    <div class="form-group"><label>ملاحظات</label><input type="text" id="f-notes" placeholder="أي تفاصيل إضافية..."></div>
    <button class="btn-primary" onclick="addClient()"><span>💾</span> حفظ العقد</button>
  </div>
</div>

<div id="page-reports" class="page">
  <div class="form-card">
    <div class="section-title" style="margin-bottom:14px;">تقارير سريعة</div>
    <div class="quick-reports-grid">
      <button class="quick-report-btn" onclick="openFollowUpReport()"><span style="font-size:24px;">📇</span><span style="font-size:11.5px;font-weight:700;">متابعة العملاء</span></button>
      <button class="quick-report-btn" onclick="openDeferredSalesReport()"><span style="font-size:24px;">📈</span><span style="font-size:11.5px;font-weight:700;">المبيعات الآجلة</span></button>
      <button class="quick-report-btn" onclick="openMonthlySalesReport()"><span style="font-size:24px;">🗓️</span><span style="font-size:11.5px;font-weight:700;">المبيعات الشهرية</span></button>
      <button class="quick-report-btn" onclick="openSettledReport()"><span style="font-size:24px;">🧾</span><span style="font-size:11.5px;font-weight:700;">المسددين</span></button>
    </div>
  </div>
  <div class="form-card">
    <div class="section-title" style="margin-bottom:14px;">التقرير الشامل والنسخ الاحتياطي للأمان</div>
    <div id="reports-content" style="margin-bottom: 20px;">جاري التحميل...</div>
    <div style="border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px;">
      <div class="section-title" style="margin-bottom:10px;">🛡️ إدارة النسخ الاحتياطي (الأمان التام)</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn-secondary" onclick="exportBackupJSON()">📤 تصدير نسخة (JSON)</button>
        <button class="btn-primary" style="background:var(--teal); margin:0;" onclick="document.getElementById('import-file').click()">📥 استيراد نسخة</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importBackupJSON(event)">
      </div>
    </div>
  </div>
</div>

<script>
// ========= رابط السكربت المحدث =========
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHgeBO7HlH-ZOwR-bwVjPrzfhxYKJQ9QdYj4EJZDW3x7-JkizDTZRi1ZLFuFkz-ZZC/exec";
const SYNC_TOKEN = ""; // خله فاضي للتجربة أو حط الرمز إن وجد
// ======================================

function getUrlWithToken() {
  return SYNC_TOKEN ? SCRIPT_URL + "?token=" + encodeURIComponent(SYNC_TOKEN) : SCRIPT_URL;
}

const LS_KEY = 'iqsat_v3';
const PAGE_SIZE = 40;
const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const PIN_KEY = 'iqsat_pin_hash';

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

let lockMode = 'enter';
function initLock() {
  const hash = lsGet(PIN_KEY);
  const confirmInput = document.getElementById('lock-input-confirm');
  if (!hash) {
    lockMode = 'setup';
    document.getElementById('lock-title').textContent = 'أنشئ رمز دخول جديد';
    confirmInput.style.display = 'block';
  } else {
    lockMode = 'enter';
    document.getElementById('lock-title').textContent = 'أدخل رمز الدخول';
    confirmInput.style.display = 'none';
  }
}
async function submitLock() {
  const val = document.getElementById('lock-input').value.trim();
  if (val.length < 4) return;
  if (lockMode === 'setup') {
    const confirmVal = document.getElementById('lock-input-confirm').value.trim();
    if (val !== confirmVal) return;
    lsSet(PIN_KEY, await sha256Hex(val));
    unlockApp();
  } else {
    if (await sha256Hex(val) === lsGet(PIN_KEY)) unlockApp();
  }
}
function unlockApp() { document.getElementById('lock-screen').style.display = 'none'; init(); }

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function safeParse(str, fallback) {
  if (Array.isArray(str)) return str;
  try { const v = JSON.parse(str); return Array.isArray(v) ? v : fallback; } catch(e) { return fallback; }
}

let clients = lsGet(LS_KEY) ? safeParse(lsGet(LS_KEY), []) : [];
let currentFilter = 'all';
let shownCount = PAGE_SIZE;

function setStatus(text, color) {
  const el = document.getElementById('sync-status');
  if (el) { el.textContent = text; el.style.color = color || '#2ecc71'; }
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n) { return new Intl.NumberFormat('ar-SA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(parseFloat(n || 0)); }

let cloudReady = false;
let cloudSaving = false, cloudPending = false;

function rowToClient(r) {
  return {
    id: r[0], name: String(r[1] ?? ''), phone: r[2] ? String(r[2]) : '', guarantor: r[3] ? String(r[3]) : '', guarantorPhone: r[4] ? String(r[4]) : '',
    total: parseFloat(r[5]) || 0, monthly: parseFloat(r[6]) || 0, paid: parseFloat(r[7]) || 0, remaining: parseFloat(r[8]) || 0,
    startDate: r[9] || '', dueDay: parseInt(r[10]) || 1, notes: r[11] || '',
    paymentsLog: r[12] ? safeParse(r[12], []) : [], discounts: r[13] ? safeParse(r[13], []) : []
  };
}

async function loadDataFromCloud(manual) {
  if (!SCRIPT_URL.includes('/exec')) { setStatus('⚠️ حط رابط السكربت', '#e74c3c'); return; }
  setStatus('⏳ جاري جلب البيانات...', '#f1c40f');
  try {
    const res = await fetch(getUrlWithToken(), { method: 'GET', mode: 'cors' });
    const rows = await res.json();
    if (!Array.isArray(rows)) { setStatus('⚠️ السكربت رجّع خطأ', '#e74c3c'); console.log(rows); return; }
    if (rows.length === 0 || (rows.length === 1)) { cloudReady = true; setStatus('السحابة فاضية - سأرفع المحلي', '#f39c12'); if(clients.length>0) saveToCloud(true); else setStatus('متصل ✅ السحابة فاضية'); return; }
    const cloud = rows.slice(1).filter(r => r[0] !== '' && r[1] !== '').map(rowToClient);
    const localIds = new Set(clients.map(c => String(c.id)));
    const cloudIds = new Set(cloud.map(c => String(c.id)));
    let added = 0, missing = 0;
    cloud.forEach(c => { if (!localIds.has(String(c.id))) { clients.push(c); added++; } });
    clients.forEach(c => { if (!cloudIds.has(String(c.id))) missing++; });
    cloudReady = true;
    lsSet(LS_KEY, JSON.stringify(clients));
    renderAll();
    if (missing > 0) saveToCloud(); else setStatus('متصل بالسحابة ✅ ' + cloud.length + ' عميل');
    if (manual) showToast('✅ تمت المزامنة (جديد: ' + added + '، مرفوع: ' + missing + ')', 'green');
  } catch(e) {
    console.error(e);
    setStatus('⚠️ محلي فقط - ' + e.message, '#f39c12');
  }
}

async function saveToCloud(force) {
  lsSet(LS_KEY, JSON.stringify(clients));
  if (!SCRIPT_URL.includes('/exec')) return;
  if (!cloudReady && !force) { setStatus('⚠️ محفوظ محلياً (بانتظار أول جلب)', '#f39c12'); return; }
  if (cloudSaving) { cloudPending = true; return; }
  cloudSaving = true;
  setStatus('💾 جاري الحفظ بالسحابة...', '#f1c40f');
  const rows = [["ID", "الاسم", "الجوال", "الكفيل", "جوال_الكفيل", "الإجمالي", "القسط", "المسدد", "المتبقي", "تاريخ_البداية", "يوم_الاستحقاق", "الملاحظات", "PaymentsLog", "Discounts"]];
  clients.forEach(c => rows.push([c.id, c.name, c.phone||'', c.guarantor||'', c.guarantorPhone||'', c.total, c.monthly, c.paid, c.remaining, c.startDate, c.dueDay||'', c.notes||'', JSON.stringify(c.paymentsLog||[]), JSON.stringify(c.discounts||[])]));
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', mode: 'cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({ token: SYNC_TOKEN, bulkReplace: rows }) });
    const out = await res.json();
    if (out && (out.ok || out.status === 'success')) { cloudReady = true; setStatus('محدث بالسحابة ✅', '#2ecc71'); if (force) showToast('✅ تمت الاستعادة ورُفعت للسحابة', 'green'); }
    else throw new Error((out && out.error) || 'server');
  } catch(e) {
    setStatus('⚠️ حفظ محلي فقط (فشل الرفع)', '#e74c3c');
    showToast('⚠️ لم يُرفع للسحابة: ' + e.message, 'red');
  } finally {
    cloudSaving = false;
    if (cloudPending) { cloudPending = false; saveToCloud(); }
  }
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3500);
}
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
}
function renderAll() { renderHome(); renderClients(); }
function analyze(client) {
  const start = new Date(client.startDate);
  if (isNaN(start)) return { delayed: [], status: client.remaining <= 0.001 ? 'completed' : 'on-track' };
  const dueDay = client.dueDay || start.getDate();
  let delayed = 0;
  const now = new Date();
  const diffMonths = (now.getFullYear() - start.getFullYear())*12 + (now.getMonth() - start.getMonth());
  const expectedPaid = Math.max(0, diffMonths) * client.monthly;
  if(client.paid + 0.01 < expectedPaid && client.remaining > 0.01) delayed = 1;
  const status = client.remaining <= 0.01 ? 'completed' : (delayed ? 'delayed' : 'on-track');
  return { delayed: delayed ? [1] : [], status };
}
function renderHome() {
  let totalRem = 0, totalPaid = 0;
  clients.forEach(c => { totalRem += c.remaining; totalPaid += c.paid; });
  const delayedItems = clients.map(c => ({c, info: analyze(c)})).filter(x => x.info.status === 'delayed');
  document.getElementById('stats-strip').innerHTML = `
    <div class="stat-card"><div class="stat-label">المتبقي الإجمالي</div><div class="stat-value gold">${fmt(totalRem)} <span class="stat-unit">ر.س</span></div></div>
    <div class="stat-card"><div class="stat-label">إجمالي المسدد</div><div class="stat-value green">${fmt(totalPaid)} <span class="stat-unit">ر.س</span></div></div>
    <div class="stat-card"><div class="stat-label">إجمالي العقود</div><div class="stat-value">${clients.length}</div></div>
    <div class="stat-card"><div class="stat-label">متأخرون</div><div class="stat-value red">${delayedItems.length}</div></div>
  `;
  document.getElementById('delayed-list').innerHTML = delayedItems.length === 0 ? '<div style="text-align:center;padding:32px;color:var(--ink-soft)">🎉 لا يوجد عملاء متأخرون حالياً</div>' : delayedItems.map(x => clientCardHTML(x.c, x.info)).join('');
}
function setFilter(el, val) { currentFilter = val; shownCount = PAGE_SIZE; document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); renderClients(); }
function debouncedSearch() { setTimeout(() => { shownCount = PAGE_SIZE; renderClients(); }, 250); }
function renderClients() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  let list = clients;
  if (q) list = list.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').includes(q));
  let items = list.map(c => ({c, info: analyze(c)}));
  if (currentFilter !== 'all') items = items.filter(x => x.info.status === currentFilter);
  const container = document.getElementById('clients-list');
  if (items.length === 0) { container.innerHTML = '<div style="text-align:center;padding:32px;color:var(--ink-soft)">📋 لا توجد نتائج</div>'; return; }
  container.innerHTML = items.slice(0, shownCount).map(x => clientCardHTML(x.c, x.info)).join('');
}
function clientCardHTML(client, info) {
  const statusLabels = { completed: ['مكتمل','badge-completed'], delayed: ['متأخر','badge-delayed'], 'on-track': ['منتظم','badge-on-track'] };
  const [label, badgeClass] = statusLabels[info.status];
  const pct = client.total > 0 ? ((client.paid / client.total) * 100).toFixed(0) : '0';
  return `<div class="client-card ${info.status}">
    <div class="client-head"><div><div class="client-name">${esc(client.name)}</div>${client.phone ? `<div class="client-phone">📱 ${esc(client.phone)}</div>` : ''}</div><span class="status-badge ${badgeClass}">${label}</span></div>
    <div class="client-body">
      <div class="progress-wrap"><div class="progress-labels"><span>المسدد ${fmt(client.paid)} ر.س</span><span>${pct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      <div class="info-grid">
        <div class="info-item"><div class="lbl">الإجمالي</div><div class="val">${fmt(client.total)} ر.س</div></div>
        <div class="info-item"><div class="lbl">القسط</div><div class="val">${fmt(client.monthly)} ر.س</div></div>
        <div class="info-item"><div class="lbl">المتبقي</div><div class="val danger">${fmt(client.remaining)} ر.س</div></div>
      </div>
    </div>
    <div class="client-actions">
      ${info.status !== 'completed' ? `<button class="action-btn btn-pay" onclick="payInstallment('${client.id}')">💵 تحصيل</button>` : ''}
      <button class="action-btn btn-details" onclick="alert('التفاصيل: ${esc(client.name)} - المتبقي ${fmt(client.remaining)}')">📋</button>
      <button class="action-btn btn-del" onclick="deleteClient('${client.id}')">🗑️</button>
    </div>
  </div>`;
}
function addClient() {
  const name = document.getElementById('f-name').value.trim();
  const total = parseFloat(document.getElementById('f-total').value) || 0;
  const monthly = parseFloat(document.getElementById('f-monthly').value) || 0;
  const startDate = document.getElementById('f-start').value;
  if (!name || !total || !monthly || !startDate) { showToast('⚠️ يرجى ملء الحقول المطلوبة', 'red'); return; }
  clients.push({ id: Date.now(), name, phone: document.getElementById('f-phone').value.trim(), guarantor: document.getElementById('f-guarantor').value.trim(), guarantorPhone: document.getElementById('f-guarantor-phone').value.trim(), total, monthly, remaining: total, paid: 0, startDate, dueDay: parseInt(document.getElementById('f-day').value)||1, notes: document.getElementById('f-notes').value.trim(), paymentsLog: [], discounts: [] });
  saveToCloud(true); renderAll(); showToast('✅ تم حفظ العقد', 'green');
}
function payInstallment(id) {
  const amt = parseFloat(prompt('مبلغ التحصيل؟'));
  if(!amt) return;
  const c = clients.find(x => String(x.id) === String(id));
  c.paid = parseFloat((c.paid + amt).toFixed(2));
  c.remaining = parseFloat((c.remaining - amt).toFixed(2));
  if(!c.paymentsLog) c.paymentsLog=[];
  c.paymentsLog.push({date: new Date().toISOString().split('T')[0], amount: amt});
  saveToCloud(true); renderAll();
}
function deleteClient(id) {
  if (!confirm('هل أنت متأكد من الحذف؟')) return;
  clients = clients.filter(x => String(x.id) !== String(id));
  saveToCloud(true); renderAll(); showToast('🗑️ تم الحذف', 'green');
}
function exportBackupJSON() {
  const a = document.createElement('a');
  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
  a.download = `Almohammadiyah_Backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}
function importBackupJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (confirm('استيراد ' + imported.length + ' عميل؟')) {
        clients = imported; lsSet(LS_KEY, JSON.stringify(clients)); renderAll();
        saveToCloud(true);
      }
    } catch(err) { showToast('⚠️ خطأ بالملف', 'red'); }
  };
  r.readAsText(file, "UTF-8");
}
function init() {
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  renderAll();
  loadDataFromCloud();
}
initLock();
</script>
<div class="toast" id="toast"></div>
</body>
</html>
