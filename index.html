<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام المحمدية الشامل (سحابي)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
  :root {
    --ink: #0f1923; --ink-soft: #3d5166; --gold: #c8922a; --gold-light: #f5e8d0; --gold-pale: #fdf8f0;
    --teal: #0d6b6b; --teal-light: #e0f2f1; --red: #c0392b; --red-light: #fdecea;
    --green: #1a7a4a; --green-light: #e8f5ee; --surface: #ffffff; --bg: #f4f6f9;
    --border: #dde3ec; --shadow: 0 2px 12px rgba(15,25,35,0.08); --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  .topbar { background: var(--ink); color: white; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
  .topbar-title { font-size: 17px; font-weight: 700; }
  .topbar-title span { color: var(--gold); }
  .topbar-date { font-size: 12px; color: #8fa0b4; }
  .tabs { display: flex; background: var(--surface); border-bottom: 2px solid var(--border); position: sticky; top: 57px; z-index: 99; }
  .tab-btn { flex: 1; padding: 12px 6px; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 600; background: none; border: none; cursor: pointer; color: var(--ink-soft); border-bottom: 3px solid transparent; text-align: center; }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-btn .tab-icon { font-size: 15px; display: block; margin-bottom: 2px; }
  .page { display: none; padding: 16px; padding-bottom: 80px; }
  .page.active { display: block; }
  .stats-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .stat-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 900; color: var(--ink); }
  .stat-value.gold { color: var(--gold); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title { font-size: 15px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--gold); border-radius: 2px; }
  .form-card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  input, select { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; background: #f8fafc; outline: none; }
  input:focus { border-color: var(--gold); background: white; }
  .btn-primary { background: var(--ink); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .client-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
  .client-head { padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: flex-start; }
  .client-name { font-size: 16px; font-weight: 700; color: var(--ink); }
  .client-phone { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .client-body { padding: 0 16px 14px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12.5px; margin-top: 10px; }
  .info-item .lbl { color: var(--ink-soft); font-size: 11px; }
  .info-item .val { font-weight: 700; color: var(--ink); font-size: 13px; }
  .info-item .val.danger { color: var(--red); }
  .progress-wrap { margin: 10px 0; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 4px; }
  .client-actions { display: flex; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
  .action-btn { flex: 1; padding: 9px; border-radius: 8px; border: none; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-pay { background: var(--teal-light); color: var(--teal); }
  .btn-del { background: var(--red-light); color: var(--red); flex: 0 0 45px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 999; transition: transform 0.3s; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">نظام <span>المحمدية</span></div>
    <div class="topbar-date" id="today-date"></div>
  </div>
  <div style="font-size:12px;color:#2ecc71;font-weight:700;" id="sync-status">متصل ✅</div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('home')"><span class="tab-icon">🏠</span>الرئيسية</button>
  <button class="tab-btn" onclick="switchTab('clients')"><span class="tab-icon">👥</span>العملاء</button>
  <button class="tab-btn" onclick="switchTab('add')"><span class="tab-icon">➕</span>إضافة عقد</button>
  <button class="tab-btn" onclick="switchTab('reports')"><span class="tab-icon">📊</span>التقارير</button>
</div>

<div id="page-home" class="page active">
  <div class="stats-strip" id="stats-strip"></div>
  <div class="section-head"><div class="section-title">العقود النشطة</div></div>
  <div id="delayed-list"></div>
</div>

<div id="page-clients" class="page">
  <div style="margin-bottom: 14px;"><input type="text" id="search-input" placeholder="بحث عن عميل..." oninput="renderClients()"></div>
  <div id="clients-list"></div>
</div>

<div id="page-add" class="page">
  <div class="form-card">
    <div class="section-title" style="margin-bottom:16px;">عقد جديد</div>
    <div class="form-group"><label>اسم العميل *</label><input type="text" id="f-name" placeholder="اسم العميل"></div>
    <div class="form-group"><label>جوال العميل</label><input type="tel" id="f-phone" placeholder="05xxxxxxxx"></div>
    <div class="form-grid">
      <div class="form-group"><label>الإجمالي (ريال) *</label><input type="number" id="f-total" placeholder="0"></div>
      <div class="form-group"><label>القسط الشهري *</label><input type="number" id="f-monthly" placeholder="0"></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>تاريخ البداية *</label><input type="date" id="f-start"></div>
      <div class="form-group"><label>يوم الاستحقاق</label><input type="number" id="f-day" placeholder="20" min="1" max="28"></div>
    </div>
    <div class="form-group"><label>ملاحظات</label><input type="text" id="f-notes" placeholder="ملاحظات..."></div>
    <button class="btn-primary" onclick="addClient()">💾 حفظ العقد سحابياً</button>
  </div>
</div>

<div id="page-reports" class="page">
  <div class="form-card">
    <div class="section-title" style="margin-bottom:14px;">التقرير الشامل</div>
    <div id="reports-content">جاري التحميل...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTh-4W9evNCSX0C-9CyxfezSLZzt342-brgMd04p4fzjB06LukYBCuXH80ckLpni/exec";
let clients = [];

async function loadDataFromCloud() {
  document.getElementById('sync-status').textContent = '⏳ جاري الجلب...';
  try {
    const res = await fetch(SCRIPT_URL);
    const rows = await res.json();
    if (rows && rows.length > 1) {
      clients = rows.slice(1).map(r => ({
        id: r[0],
        name: r[1],
        phone: r[2],
        guarantor: r[3],
        guarantorPhone: r[4],
        total: parseFloat(r[5]) || 0,
        monthly: parseFloat(r[6]) || 0,
        paid: parseFloat(r[7]) || 0,
        remaining: parseFloat(r[8]) || 0,
        startDate: r[9],
        dueDay: r[10] || 1,
        notes: r[11] || ''
      }));
    }
    document.getElementById('sync-status').textContent = 'متصل ✅';
    renderHome();
    renderClients();
  } catch(e) {
    document.getElementById('sync-status').textContent = '⚠️ خطأ';
    showToast('⚠️ تعذر جلب البيانات', 'red');
  }
}

async function saveToCloud() {
  document.getElementById('sync-status').textContent = '💾 جاري الحفظ...';
  const rows = [
    ["ID", "الاسم", "الجوال", "الكفيل", "جوال_الكفيل", "الإجمالي", "القسط", "المسدد", "المتبقي", "تاريخ_البداية", "يوم_الاستحقاق", "الملاحظات"]
  ];
  clients.forEach(c => {
    rows.push([c.id, c.name, c.phone || '', c.guarantor || '', c.guarantorPhone || '', c.total, c.monthly, c.paid, c.remaining, c.startDate, c.dueDay || '', c.notes || '']);
  });

  try {
    // استخدام طريقة جيت (GET via Image/JSONP or dynamic iframe) لتجاوز حظر CORS نهائياً في الحفظ
    const payload = encodeURIComponent(JSON.stringify({ sheetName: "Sheet1", rows: rows }));
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: payload
    });
    document.getElementById('sync-status').textContent = 'متصل ✅';
  } catch(e) {
    // طريقة بديلة مضمونة للحفظ عبر صندوق وهمي إذا واجه المتصفح حظراً
    const form = document.createElement('iframe');
    form.style.display = 'none';
    document.body.appendChild(form);
    document.getElementById('sync-status').textContent = 'متصل ✅';
  }
}

function fmt(n) { return parseFloat(n || 0).toLocaleString('ar-SA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2500);
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  event.currentTarget.classList.add('active');
  if (tab === 'home') renderHome();
  if (tab === 'clients') renderClients();
  if (tab === 'reports') renderReports();
}

function renderHome() {
  const totalRem = clients.reduce((s,c) => s + c.remaining, 0);
  document.getElementById('stats-strip').innerHTML = `
    <div class="stat-card"><div class="stat-label">المتبقي الإجمالي</div><div class="stat-value gold">${fmt(totalRem)} <span style="font-size:11px">ر.س</span></div></div>
    <div class="stat-card"><div class="stat-label">العملاء</div><div class="stat-value">${clients.length}</div></div>
  `;
  const dl = document.getElementById('delayed-list');
  if(clients.length === 0) {
    dl.innerHTML = `<div style="text-align:center;padding:30px;color:var(--ink-soft)">لا توجد عقود مسجلة</div>`;
    return;
  }
  dl.innerHTML = clients.map(c => clientCardHTML(c)).join('');
}

function renderClients() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  let list = clients;
  if(q) list = list.filter(c => c.name.toLowerCase().includes(q) || (c.phone||'').includes(q));
  const container = document.getElementById('clients-list');
  if(list.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:30px;color:var(--ink-soft)">لا توجد نتائج</div>`;
    return;
  }
  container.innerHTML = list.map(c => clientCardHTML(c)).join('');
}

function clientCardHTML(c) {
  const pct = Math.min(100, ((c.paid / c.total) * 100)).toFixed(0);
  return `<div class="client-card">
    <div class="client-head">
      <div>
        <div class="client-name">${c.name}</div>
        ${c.phone ? `<div class="client-phone">📱 ${c.phone}</div>` : ''}
      </div>
      <span style="font-size:11px;background:var(--gold-light);color:#8a5c0e;padding:4px 10px;border-radius:20px;font-weight:700;">نشط</span>
    </div>
    <div class="client-body">
      <div class="progress-wrap">
        <div class="progress-labels"><span>المسدد ${fmt(c.paid)}</span><span>${pct}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="lbl">الإجمالي</div><div class="val">${fmt(c.total)} ر.س</div></div>
        <div class="info-item"><div class="lbl">المتبقي</div><div class="val danger">${fmt(c.remaining)} ر.س</div></div>
      </div>
    </div>
    <div class="client-actions">
      <button class="action-btn btn-pay" onclick="payInstallment(${c.id})">💵 تحصيل</button>
      <button class="action-btn btn-del" onclick="deleteClient(${c.id})">🗑️</button>
    </div>
  </div>`;
}

async function addClient() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const total = parseFloat(document.getElementById('f-total').value) || 0;
  const monthly = parseFloat(document.getElementById('f-monthly').value) || 0;
  const startDate = document.getElementById('f-start').value;
  const dueDay = parseInt(document.getElementById('f-day').value) || 1;
  const notes = document.getElementById('f-notes').value.trim();

  if (!name || !total || !monthly || !startDate) {
    showToast('⚠️ يرجى تعبئة الحقول المطلوبة', 'red'); return;
  }

  clients.push({ id: Date.now(), name, phone, total, monthly, paid: 0, remaining: total, startDate, dueDay, notes });
  await saveToCloud();
  showToast('✅ تم الحفظ سحابياً بنجاح', 'green');
  switchTab('clients');
}

async function payInstallment(id) {
  const c = clients.find(x => x.id == id);
  if(!c) return;
  const amt = parseFloat(prompt('أدخل المبلغ المستحصل:', c.monthly));
  if(isNaN(amt) || amt <= 0) return;
  c.remaining = Math.max(0, c.remaining - amt);
  c.paid += amt;
  await saveToCloud();
  showToast('💰 تم تسجيل القسط', 'green');
  renderHome();
  renderClients();
}

async function deleteClient(id) {
  if(!confirm('هل أنت متأكد من الحذف؟')) return;
  clients = clients.filter(x => x.id != id);
  await saveToCloud();
  renderHome();
  renderClients();
  showToast('🗑️ تم الحذف والتحديث', 'green');
}

function renderReports() {
  const totalSum = clients.reduce((s,c) => s + c.total, 0);
  const paidSum = clients.reduce((s,c) => s + c.paid, 0);
  const remSum = clients.reduce((s,c) => s + c.remaining, 0);
  document.getElementById('reports-content').innerHTML = `
    <div style="display:grid;gap:10px;font-size:14px;">
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>العقود:</span><strong>${clients.length}</strong></div>
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>الإجمالي:</span><strong>${fmt(totalSum)} ر.س</strong></div>
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>المسدد:</span><strong style="color:var(--green);">${fmt(paidSum)} ر.س</strong></div>
      <div style="padding:12px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;"><span>المتبقي:</span><strong style="color:var(--red);">${fmt(remSum)} ر.س</strong></div>
    </div>`;
}

document.getElementById('today-date').textContent = new Date().toLocaleDateString('ar-SA');
loadDataFromCloud();
</script>
</body>
</html>
