<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>نظام المحمدية - جاهز</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f9f5;color:#14532d}
header{background:#14532d;color:#fff;padding:16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.container{max-width:1100px;margin:auto;padding:14px}
nav{display:flex;gap:8px;overflow:auto;padding:10px 0}nav button{background:#fff;padding:11px 14px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 1px 3px #0001}
nav button.active{background:#b8860b;color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001;border-top:3px solid #b8860b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:14px;background:#fff;border-radius:12px;border-top:3px solid #b8860b}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
input,textarea{padding:11px;border:1px solid #d6e4d7;border-radius:10px;width:100%}
.btn{padding:11px 14px;border-radius:10px;border:0;cursor:pointer;background:#e7efe8}
.btn.primary{background:#b8860b;color:#fff}.btn.green{background:#166534;color:#fff}.btn.red{background:#a33a2b;color:#fff}
.hidden{display:none!important}
.cloud-status{font-size:12px;background:#fff;padding:8px 12px;border-radius:10px;border:1px solid #ddd;display:flex;align-items:center;gap:8px}
.cloud-dot{width:10px;height:10px;border-radius:50%;background:#999}.cloud-dot.ok{background:#16a34a}.cloud-dot.err{background:#dc2626}.cloud-dot.busy{background:#b8860b}
.client-card{background:#fff;border:1px solid #dfe9e1;border-radius:12px;padding:12px;margin:8px 0}
.report-table{width:100%;border-collapse:collapse;min-width:700px}.report-table th,.report-table td{border:1px solid #ddd;padding:9px;text-align:right}
.table-wrap{overflow:auto}
.toast{position:fixed;bottom:18px;left:18px;background:#14532d;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:200}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div><b>نظام المحمدية</b><br><small>مربوط بالسحابة ومحمي</small></div>
<div class="cloud-status"><span id="cloudDot" class="cloud-dot"></span><span id="cloudStatus">جاري...</span></div>
</header>
<div class="container">
<nav>
<button class="active" data-tab="home" onclick="showTab('home')">الرئيسية</button>
<button data-tab="clients" onclick="showTab('clients')">العملاء</button>
<button data-tab="add" onclick="showTab('add')">➕ إضافة</button>
<button data-tab="reports" onclick="showTab('reports')">📊 التقارير</button>
<button data-tab="backup" onclick="showTab('backup')">💾 النسخ</button>
</nav>
<section id="home" class="tab">
<div class="grid">
<div class="stat"><small>العقود</small><b id="sContracts">0</b></div>
<div class="stat"><small>الإجمالي</small><b id="sTotal">0</b></div>
<div class="stat"><small>المسدد</small><b id="sPaid">0</b></div>
<div class="stat"><small>المتبقي</small><b id="sRemain">0</b></div>
</div>
</section>
<section id="clients" class="tab hidden">
<div class="card">
<input id="search" placeholder="ابحث بالاسم أو الجوال" oninput="renderClients()" style="margin-bottom:10px">
<div id="clientCards"></div>
</div>
</section>
<section id="add" class="tab hidden">
<div class="card">
<h3 id="formTitle">إضافة عقد جديد</h3>
<input type="hidden" id="editingId">
<div class="form-grid">
<div class="field"><label>اسم العميل *</label><input id="name"></div>
<div class="field"><label>الجوال</label><input id="phone"></div>
<div class="field"><label>الكفيل</label><input id="guarantor"></div>
<div class="field"><label>جوال الكفيل</label><input id="guarantorPhone"></div>
<div class="field"><label>الإجمالي *</label><input id="total" type="number"></div>
<div class="field"><label>القسط *</label><input id="monthly" type="number"></div>
<div class="field"><label>تاريخ البداية</label><input id="startDate" type="date"></div>
<div class="field"><label>يوم الاستحقاق</label><input id="dueDay" type="number" value="1" min="1" max="28"></div>
<div class="field full"><label>ملاحظات</label><textarea id="notes"></textarea></div>
</div>
<div style="margin-top:12px"><button class="btn primary" onclick="saveContract()">💾 حفظ</button> <button class="btn" onclick="resetForm()">تفريغ</button></div>
</div>
</section>
<section id="reports" class="tab hidden">
<div class="card">
<h3>📊 التقارير</h3>
<div class="table-wrap">
<table class="report-table"><thead><tr><th>الاسم</th><th>الجوال</th><th>القسط</th><th>المتبقي</th><th>الكفيل</th></tr></thead><tbody id="reportBody"></tbody></table>
</div>
</div>
</section>
<section id="backup" class="tab hidden">
<div class="card">
<h3>النسخ الاحتياطي</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn green" onclick="syncToCloud()">☁️ رفع محمي</button>
<button class="btn" onclick="syncFromCloud()">☁️ تحميل من الشيت</button>
<button class="btn primary" onclick="exportJSON()">📤 تصدير JSON</button>
<button class="btn red" onclick="clearAllData()">🗑️ مسح المحلي</button>
</div>
<div id="cloudInfo" style="margin-top:14px;font-size:13px"></div>
</div>
</section>
</div>
<div id="toast" class="toast"></div>
